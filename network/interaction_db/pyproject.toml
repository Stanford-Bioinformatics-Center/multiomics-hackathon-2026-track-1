[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "string-network"
version = "0.1.0"
description = "Reproducible rebuild of the human STRING v12.0 PPI network in UniProt space."
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=12.0",
    "requests>=2.28",
    "tqdm>=4.60",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
